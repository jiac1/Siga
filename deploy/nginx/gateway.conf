# Gateway local de docker-compose: reproduce las reglas de enrutamiento del
# ALB/CloudFront de AWS (mismo dominio, ruteo por prefijo, sin reescritura).
upstream core          { server core:8000; }
upstream mapa_calor    { server mapa-calor:8000; }
upstream estres_malla  { server estres-malla:8000; }

server {
    listen 8080;
    server_name _;
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location ^~ /core/         { proxy_pass http://core; }
    location ^~ /mapa-calor/   { proxy_pass http://mapa_calor; }
    location ^~ /estres-malla/ { proxy_pass http://estres_malla; }

    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
    location ~* \.(json)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=300";
    }
}
