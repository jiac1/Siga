name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SUITE_SSO_SECRET: "pruebas-ci-suite-unab-secreto-de-al-menos-32-caracteres"
  DATABASE_URL: "sqlite://:memory:"

jobs:
  calidad:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q ruff
      - run: ruff check packages services/core scripts
      - run: ruff format --check packages services/core scripts

  pruebas:
    name: Pruebas automatizadas
    runs-on: ubuntu-latest
    needs: calidad
    strategy:
      fail-fast: false
      matrix:
        servicio:
          - packages/suite-sso
          - services/core
          - services/mapa-calor
          - services/estres-malla
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements-dev.txt
      - working-directory: ${{ matrix.servicio }}
        run: python -m pytest -q

  motor:
    name: Regresión del motor de convalidación
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements-dev.txt
      - run: python scripts/evaluacion/evaluar_motor.py

  terraform:
    name: Validar Terraform
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - working-directory: infra/terraform
        run: terraform init -backend=false
        continue-on-error: true
      - working-directory: infra/terraform
        run: terraform validate
        continue-on-error: true
